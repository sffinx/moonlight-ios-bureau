name: IPA Moonlight Bureau

# Compile une IPA non signée pour iPhone (à signer ensuite par sideload : SideStore, AltStore, Sideloadly…).
on:
  push:
    branches:
      - bureau
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: IPA iOS
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        # Only the simulator runtime is downloaded here; a device (iphoneos) build uses the
        # SDK bundled with Xcode. It fails at times ("Unable to connect to simulator").
        run: |
          xcodebuild -downloadPlatform iOS || echo "::warning::xcodebuild -downloadPlatform iOS a échoué (simulateur seulement), compilation iphoneos poursuivie"

      - name: Build Release (iphoneos, non signé)
        run: |
          set -o pipefail
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -200

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          # Numéro de build = numéro de run : SideStore exige qu'il corresponde au buildVersion de la source
          PLIST="Payload/$(basename "$APP")/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          # Version unique par build : certaines versions de SideStore ne comparent que la version
          BASE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BASE}.${{ github.run_number }}" "$PLIST"
          zip -qry MoonlightBureau.ipa Payload
          ls -l MoonlightBureau.ipa
          shasum -a 256 MoonlightBureau.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoonlightBureau-ipa
          path: MoonlightBureau.ipa
          retention-days: 30

      - name: Publish release "latest" + SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INFO=$(find Payload -maxdepth 2 -name Info.plist | head -1)
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO")
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO")
          SIZE=$(stat -f%z MoonlightBureau.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="${{ github.repository }}"
          SHA=$(shasum -a 256 MoonlightBureau.ipa | cut -d' ' -f1)
          python3 - "$VERSION" "$BUILD" "$BUNDLE" "$SIZE" "$DATE" "$REPO" "$SHA" <<'PY'
          import json, sys
          version, build, bundle, size, date, repo, sha = sys.argv[1:]
          # Une adresse par build : une adresse fixe laisse SideStore réutiliser une IPA ou une source en cache
          url = f"https://github.com/{repo}/releases/download/latest/MoonlightBureau-{build}.ipa"
          icon = f"https://raw.githubusercontent.com/{repo}/bureau/Limelight/Images.xcassets/AppIcon.appiconset/1024x%20icon.png"
          desc = ("Moonlight iOS, mode bureau : zoom en pinçant en mode Touchpad, vue qui suit le curseur, "
                  "barre d'outils (texte Unicode, raccourcis, collage depuis l'iPhone).")
          source = {
              "name": "Moonlight Bureau",
              "identifier": "io.github.sffinx.moonlight-ios-bureau",
              "sourceURL": f"https://github.com/{repo}/releases/download/latest/source.json",
              "apps": [{
                  "name": "Moonlight Bureau",
                  "bundleIdentifier": bundle,
                  "developerName": "sffinx (fork de Moonlight Game Streaming Project)",
                  "subtitle": "Moonlight en mode bureau",
                  "localizedDescription": desc,
                  "iconURL": icon,
                  "tintColor": "#3b82f6",
                  "category": "utilities",
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": date,
                      "localizedDescription": f"Build {build} ({sha[:12]})",
                      "downloadURL": url,
                      "size": int(size),
                      "sha256": sha,
                      "minOSVersion": "15.0",
                  }],
              }],
              "news": [],
          }
          json.dump(source, open("source.json", "w"), ensure_ascii=False, indent=2)
          PY
          NOTES="IPA non signée (sideload). Build ${BUILD}, version ${VERSION}, SHA-256 ${SHA}. Source SideStore : https://github.com/${REPO}/releases/download/latest/source.json"
          if gh release view latest -R "$REPO" > /dev/null 2>&1; then
            gh release edit latest -R "$REPO" --title "Moonlight Bureau (dernière build)" --notes "$NOTES"
          else
            gh release create latest -R "$REPO" --title "Moonlight Bureau (dernière build)" --notes "$NOTES" --target "${{ github.sha }}"
          fi
          cp MoonlightBureau.ipa "MoonlightBureau-${BUILD}.ipa"
          gh release upload latest MoonlightBureau.ipa "MoonlightBureau-${BUILD}.ipa" source.json -R "$REPO" --clobber
          # Garder seulement l'IPA numérotée de cette build
          for old in $(gh release view latest -R "$REPO" --json assets -q '.assets[].name' | grep -E '^MoonlightBureau-[0-9]+\.ipa$' | grep -v "^MoonlightBureau-${BUILD}\.ipa$" || true); do
            gh release delete-asset latest "$old" -R "$REPO" -y
          done
